<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c11" media="(prefers-color-scheme: dark)">
<script>
  /* Light/dark theme for IS-FUNDAMENTOS. Runs before first paint to avoid a
     flash: stored choice wins, otherwise the operating system preference. */
  (function () {
    var KEY = 'eci-theme';
    var BASE = '{{ "/assets/css/just-the-docs-" | relative_url }}';
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function current() { return stored() || (mq && mq.matches ? 'dark' : 'light'); }
    function sheet() { return document.querySelector('link[rel="stylesheet"][href*="just-the-docs-"]'); }
    function apply(theme) {
      var link = sheet();
      if (link) link.href = BASE + (theme === 'dark' ? 'eci-dark' : 'default') + '.css';
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('.eci-theme-toggle').forEach(function (b) {
        b.setAttribute('aria-label', theme === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro');
        b.title = b.getAttribute('aria-label');
        b.innerHTML = theme === 'dark'
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      });
    }
    apply(current());
    if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (!stored()) apply(current()); });
    document.addEventListener('DOMContentLoaded', function () {
      ['.main-header', '.site-header'].forEach(function (sel) {
        var host = document.querySelector(sel); if (!host) return;
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'eci-theme-toggle';
        b.addEventListener('click', function () {
          var next = current() === 'dark' ? 'light' : 'dark';
          try { localStorage.setItem(KEY, next); } catch (e) {}
          apply(next);
        });
        var aux = host.querySelector('.aux-nav');
        if (aux) host.insertBefore(b, aux); else host.appendChild(b);
      });
      apply(current());
    });
  })();
</script>
<style>
  /* The toggle lives in the main header on desktop and in the site header on mobile */
  .site-header .eci-theme-toggle { margin-left: auto; }
  @media (min-width: 50rem) { .site-header .eci-theme-toggle { display: none; } }
  @media (max-width: 49.99rem) { .main-header .eci-theme-toggle { display: none; } }
</style>
